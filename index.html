<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Gems Muse</title>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link
    href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#C5A065",
            "primary-hover": "#b08d55",
            "background-light": "#FAF8F5",
            "background-dark": "#121212",
            "surface-light": "#FFFFFF",
            "surface-dark": "#1E1E1E",
            "text-main-light": "#2D2D2D",
            "text-main-dark": "#E5E5E5",
            "text-muted-light": "#666666",
            "text-muted-dark": "#A3A3A3",
          },
          fontFamily: {
            sans: ['Lato', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
            script: ['Great Vibes', 'cursive'],
          },
          animation: {
            'shimmer': 'shimmer 2s infinite linear',
          },
          keyframes: {
            shimmer: {
              '0%': { transform: 'translateX(-150%) skewX(-20deg)' },
              '100%': { transform: 'translateX(150%) skewX(-20deg)' },
            }
          }
        },
      },
    };
  </script>
  <style>
    html {
      scroll-behavior: smooth;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    ::-webkit-scrollbar-thumb {
      background: #C5A065;
    }

    .text-shadow {
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Luxury Frame Animation */
    .luxury-frame {
      position: relative;
      display: inline-block;
      transition: all 0.5s ease;
    }

    .luxury-frame::after {
      content: '';
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      bottom: 20px;
      border: 1px solid #C5A065;
      opacity: 0;
      transition: all 0.6s cubic-bezier(0.19, 1, 0.22, 1);
      pointer-events: none;
      z-index: 10;
    }

    .luxury-frame:hover::after {
      opacity: 1;
      top: -12px;
      left: -12px;
      right: -12px;
      bottom: -12px;
    }

    .luxury-frame::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(197, 160, 101, 0.05);
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: 5;
    }

    .luxury-frame:hover::before {
      opacity: 1;
    }

    /* Shimmer Overlay */
    .shimmer-container {
      position: relative;
      overflow: hidden;
    }

    .shimmer-effect {
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 100%;
      background: linear-gradient(to right,
          transparent,
          rgba(255, 255, 255, 0.4),
          transparent);
      transform: translateX(-150%) skewX(-20deg);
      pointer-events: none;
      z-index: 20;
    }

    .shimmer-container:hover .shimmer-effect {
      animation: shimmer 1.5s infinite linear;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0"
  }
}
</script>

</head>

<body
  class="bg-background-light dark:bg-background-dark text-text-main-light dark:text-text-main-dark font-sans transition-colors duration-300">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
